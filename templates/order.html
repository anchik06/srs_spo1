{% extends "base.html" %}

{% block title %}Заказ — WorldBite{% endblock %}

{% block content %}

<h2>Оформление заказа</h2>

{% if error %}
    <p><strong>Ошибка:</strong> {{ error }}</p>
{% endif %}

<form method="POST" action="{{ url_for('order') }}">

    <p>
        <label for="customer_name">Ваше имя:</label><br>
        <input
            type="text"
            id="customer_name"
            name="customer_name"
            value="{{ customer_name|default('') }}"
            required
        >
    </p>

    <p>
        <label for="phone">Номер телефона:</label><br>
        <input
            type="tel"
            id="phone"
            name="phone"
            value="{{ phone|default('') }}"
            required
        >
    </p>

    <p>
        <label for="dish_id">Выберите блюдо:</label><br>

        <select id="dish_id" name="dish_id" required>
            <option value="">-- Выберите блюдо --</option>

            {% for dish in dishes %}
                <option
                    value="{{ dish.id }}"
                    {% if selected_dish|default('')|string == dish.id|string %}
                        selected
                    {% endif %}
                >
                    {{ dish.name }} — {{ dish.price }} руб
                </option>
            {% endfor %}
        </select>
    </p>

    <p>
        <label for="quantity">Количество:</label><br>
        <input
            type="number"
            id="quantity"
            name="quantity"
            min="1"
            max="10"
            value="{{ quantity|default('1') }}"
            required
        >
    </p>

    <button type="submit">Оформить заказ</button>

</form>

{% endblock %}
