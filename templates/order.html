{% extends "base.html" %}

{% block title %}Заказ — WorldBite{% endblock %}

{% block content %}

<div class="order-form">

    <h2>
        Оформление заказа
    </h2>

    <p>
        Заполните форму, и мы подготовим ваш заказ.
    </p>


    {% if error %}

    <div class="error-message">

        <strong>Ошибка:</strong>
        {{ error }}

    </div>

    {% endif %}


    <form
        method="POST"
        action="{{ url_for('order') }}"
    >

        <div class="form-group">
            <label for="customer_name">
                Ваше имя
            </label>
            <input
                type="text"
                id="customer_name"
                name="customer_name"
                value="{{ customer_name|default('') }}"
                placeholder="Введите имя"
                required
            >
        </div>
        <div class="form-group">
            <label for="phone">
                Номер телефона
            </label>
            <input
                type="tel"
                id="phone"
                name="phone"
                value="{{ phone|default('') }}"
                placeholder="+7..."
                required
            >
        </div>


        <div class="form-group">
            <label for="dish_id">
                Выберите блюдо
            </label>
            <select
                id="dish_id"
                name="dish_id"
                required
            >
                <option value="">
                    -- Выберите блюдо --
                </option>

                {% for dish in dishes %}

                <option
                    value="{{ dish.id }}"
                    {% if selected_dish|default('')|string == dish.id|string %}
                        selected
                    {% endif %}
                >
                    {{ dish.name }} — {{ dish.price }} руб
                </option>

                {% endfor %}

            </select>

        </div>

        <div class="form-group">
            <label for="quantity">
                Количество
            </label>
            <input
                type="number"
                id="quantity"
                name="quantity"
                min="1"
                max="10"
                value="{{ quantity|default('1') }}"
                required
            >
        </div>
        <button type="submit" class="button">
            Оформить заказ
        </button>
    </form>
</div>
{% endblock %}
